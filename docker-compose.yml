# All settings come from .env (see .env.example); defaults are shown below.
services:
  metashape:
    build:
      context: .
      args:
        # "latest" or a specific version, e.g. 2.1.3
        METASHAPE_VERSION: ${METASHAPE_VERSION:-latest}
    image: metashape:${METASHAPE_VERSION:-latest}
    container_name: metashape-${MODE:-node}
    restart: unless-stopped
    network_mode: host
    user: "${PUID:-1000}:${PGID:-1000}"
    tty: true    # Keep a shell usable via `docker compose exec`
    stdin_open: true
    environment:
      HOME: /tmp/home                        # writable home for non-root
      MODE: ${MODE:-node}                    # node | standalone
      METASHAPE_HOST: ${METASHAPE_HOST:-}    # server IP (node mode)
      GPU_MASK: ${GPU_MASK:-}                # empty = all visible GPUs
      CPU_ENABLE: ${CPU_ENABLE:-1}
      NODE_PRIORITY: ${NODE_PRIORITY:-5}
    volumes:
      - "${WORKSPACE_PATH:-/mnt/p}:/workspace"
      # DEV ONLY: live-mount the workflow over the copy baked into the image.
      # Remove this line for production so the image's own copy is used.
      - "./workflow:/opt/workflow:ro"
      - "./license/license.lic:/var/tmp/agisoft/licensing/licenses/license.lic:ro"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: ${GPU_COUNT:-all}       # "all" or a number of GPUs
              capabilities: [gpu, compute, utility]